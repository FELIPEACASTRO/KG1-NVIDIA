name: Notebook Release Gate

on:
  push:
  pull_request:

jobs:
  notebook-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gate Dependencies
        run: python -m pip install -q pandas

      - name: Validate Gate Script
        run: |
          python -m py_compile scripts/notebook_release_gate.py scripts/scan_repo_secrets.py scripts/kg1_static_safety_gate.py
          python scripts/notebook_release_gate.py --self-test
          python scripts/kg1_static_safety_gate.py --self-test

      - name: Secret Scan
        run: python scripts/scan_repo_secrets.py

      - name: Select Changed Notebooks
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/notebook_release_gate
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          echo "base=${BASE}"
          echo "head=${HEAD}"
          if [[ -n "${BASE}" && "${BASE}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMRT "${BASE}" "${HEAD}" > artifacts/notebook_release_gate/changed_files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${HEAD}" > artifacts/notebook_release_gate/changed_files.txt
          fi
          grep -E '\.ipynb$' artifacts/notebook_release_gate/changed_files.txt > artifacts/notebook_release_gate/changed_notebooks.txt || true
          append_if_exists() {
            if [[ -f "$1" ]]; then
              echo "$1" >> artifacts/notebook_release_gate/changed_notebooks.txt
            fi
          }
          append_release_notebooks() {
            append_if_exists notebooks/KG1_V218_DECODE_RESCUE_COLAB.ipynb
            append_if_exists notebooks/KG1_V219_WEAK_DECODE_AB_COLAB.ipynb
            append_if_exists notebooks/KG1_V220_PUBLIC_ADAPTER_PROBE_COLAB.ipynb
            append_if_exists notebooks/KG1_V221_CANDIDATE_REGISTRY_WEAK_AB_COLAB.ipynb
            append_if_exists notebooks/KG1_V230_V226_COMPLEMENTARITY_COLAB.ipynb
          }
          if grep -Eq '^scripts/build_v218_decode_rescue_colab\.py$' artifacts/notebook_release_gate/changed_files.txt; then
            append_if_exists notebooks/KG1_V218_DECODE_RESCUE_COLAB.ipynb
          fi
          if grep -Eq '^scripts/build_v219_weak_decode_ab_colab\.py$' artifacts/notebook_release_gate/changed_files.txt; then
            append_if_exists notebooks/KG1_V219_WEAK_DECODE_AB_COLAB.ipynb
          fi
          if grep -Eq '^scripts/build_v220_public_adapter_probe_colab\.py$' artifacts/notebook_release_gate/changed_files.txt; then
            append_if_exists notebooks/KG1_V220_PUBLIC_ADAPTER_PROBE_COLAB.ipynb
          fi
          if grep -Eq '^scripts/build_v221_candidate_registry_weak_ab_colab\.py$' artifacts/notebook_release_gate/changed_files.txt; then
            append_if_exists notebooks/KG1_V221_CANDIDATE_REGISTRY_WEAK_AB_COLAB.ipynb
          fi
          if grep -Eq '^scripts/build_v230_v226_complementarity_colab\.py$' artifacts/notebook_release_gate/changed_files.txt; then
            append_if_exists notebooks/KG1_V230_V226_COMPLEMENTARITY_COLAB.ipynb
          fi
          if grep -Eq '^(\.gitattributes|AGENTS\.md|scripts/notebook_release_gate\.py|scripts/scan_repo_secrets\.py|scripts/analyze_eval_predictions\.py|scripts/evaluate_lora_adapter\.py|scripts/evaluate_lora_adapters_batch\.py|src/competition_utils\.py|data/v217/|\.github/workflows/notebook-release-gate\.yml)' artifacts/notebook_release_gate/changed_files.txt; then
            append_release_notebooks
          fi
          sort -u artifacts/notebook_release_gate/changed_notebooks.txt -o artifacts/notebook_release_gate/changed_notebooks.txt
          echo "Changed release-critical files:"
          cat artifacts/notebook_release_gate/changed_files.txt
          echo "Changed notebooks:"
          cat artifacts/notebook_release_gate/changed_notebooks.txt
          if [[ -s artifacts/notebook_release_gate/changed_notebooks.txt ]]; then
            echo "has_notebooks=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_notebooks=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run Notebook Release Gate
        if: steps.changed.outputs.has_notebooks == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          paths = [
              line.strip()
              for line in Path("artifacts/notebook_release_gate/changed_notebooks.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          print("Auditing notebooks:")
          for path in paths:
              print(f"  {path}")
          raise SystemExit(subprocess.call([sys.executable, "scripts/notebook_release_gate.py", *paths]))
          PY

      - name: Run Static Safety Gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/kg1_static_safety_gate.py --paths-file artifacts/notebook_release_gate/changed_files.txt --allow-empty

      - name: No Changed Notebooks
        if: steps.changed.outputs.has_notebooks != 'true'
        run: echo "No changed notebooks to audit."
